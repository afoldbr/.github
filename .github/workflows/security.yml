# Secret scanning over the full history (gitleaks) and severe dependency vulnerabilities.
name: Security

on:
  workflow_call:
    inputs:
      audit-level:
        description: Minimum audit severity that fails the job (low, moderate, high, critical)
        type: string
        default: high
      audit-blocking:
        description: When false, a vulnerable dependency only warns instead of failing the PR
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3             git /repo --no-banner --redact -v

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ !inputs.audit-blocking }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != ''
        with:
          node-version: '22'
      - name: Audit (npm, pnpm or yarn)
        if: hashFiles('package.json') != ''
        env:
          LEVEL: ${{ inputs.audit-level }}
        run: |
          command -v corepack >/dev/null || npm install -g corepack  # Node 25+ no longer bundles it
          corepack enable
          if [ -f package-lock.json ]; then npm audit --omit=dev --audit-level="$LEVEL"
          elif [ -f pnpm-lock.yaml ]; then pnpm audit --prod --audit-level "$LEVEL"
          elif [ -f yarn.lock ]; then
            if [ -f .yarnrc.yml ]; then yarn npm audit --environment production --severity "$LEVEL"
            else yarn audit --groups dependencies --level "$LEVEL"; fi
          else echo "::notice::No lockfile: dependency audit skipped"
          fi
